<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Predictor de Costo del seguro | Insurance Cost Predictor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="card">
        <header class="hero">
          <div class="language-switcher" role="group" aria-label="Language selector">
            <button type="button" class="lang-btn" data-lang="es">Español</button>
            <button type="button" class="lang-btn" data-lang="en">English</button>
          </div>
          <p class="eyebrow" data-i18n="eyebrow">ML-powered estimation</p>
          <h1 data-i18n="title">Insurance Cost Predictor</h1>
          <p class="subtitle" data-i18n="subtitle">
            Fill in the form to estimate the insurance premium using a trained regression model.
          </p>
        </header>

        <form id="prediction-form" class="form-grid">
          <label>
            <span data-i18n="ageLabel">Age</span>
            <input type="number" name="age" min="18" max="100" required placeholder="Example: 35 years" data-i18n-placeholder="agePlaceholder" />
            <small data-i18n="ageHelp">Example: 35 years</small>
          </label>

          <label>
            <span data-i18n="sexLabel">Sex</span>
            <select name="sex" required>
              <option value="male" data-i18n="maleOption">Male</option>
              <option value="female" data-i18n="femaleOption">Female</option>
            </select>
          </label>

          <label>
            <span data-i18n="bmiLabel">Body Mass Index (BMI)</span>
            <input type="number" name="bmi" step="0.1" min="10" max="60" required placeholder="Example: 24.5" data-i18n-placeholder="bmiPlaceholder" />
            <small data-i18n="bmiHelp">Example: 24.5</small>
          </label>

          <label>
            <span data-i18n="childrenLabel">Children</span>
            <input type="number" name="children" min="0" max="10" required placeholder="Example: 2" data-i18n-placeholder="childrenPlaceholder" />
            <small data-i18n="childrenHelp">Example: 2</small>
          </label>

          <label>
            <span data-i18n="smokerLabel">Smoker</span>
            <select name="smoker" required>
              <option value="yes" data-i18n="yesOption">Yes</option>
              <option value="no" data-i18n="noOption">No</option>
            </select>
          </label>

          <label>
            <span data-i18n="regionLabel">Region</span>
            <select name="region" required>
              <option value="southeast" data-i18n="southeastOption">Southeast</option>
              <option value="southwest" data-i18n="southwestOption">Southwest</option>
              <option value="northeast" data-i18n="northeastOption">Northeast</option>
              <option value="northwest" data-i18n="northwestOption">Northwest</option>
            </select>
          </label>

          <button type="submit" class="submit-btn" data-i18n="submitButton">Predict</button>
        </form>

        <section class="result-card" id="result-card" hidden>
          <h2 data-i18n="resultTitle">Estimated insurance cost</h2>
          <p class="result-value" id="result-value">$0.00</p>
          <p class="result-message" id="result-message"></p>
        </section>
      </section>
    </main>

    <footer class="footer">
      <span class="footer-text" data-i18n="footerText">Built by Michael Acosta</span>
      <a href="https://www.linkedin.com/in/michael-acosta-dev/" target="_blank" rel="noreferrer" data-i18n-aria="linkedinLabel" aria-label="LinkedIn">
        <i class="fab fa-linkedin"></i>
      </a>
      <a href="https://github.com/MichaelAcostaDev" target="_blank" rel="noreferrer" data-i18n-aria="githubLabel" aria-label="GitHub">
        <i class="fab fa-github"></i>
      </a>
    </footer>

    <script src="/static/app.js"></script>
  </body>
</html>
